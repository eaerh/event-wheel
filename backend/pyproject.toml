[project]
name = "event-wheel-backend"
version = "1.0.0"
description = "Event Wheel - scrape events and spin to pick one"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "pydantic>=2.5.3",
    "python-dateutil>=2.8.2",
    "playwright>=1.41.0",
    "rapidfuzz>=3.14.3",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.0",
]
